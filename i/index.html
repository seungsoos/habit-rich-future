<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>습관 메이트 초대</title>
<meta name="description" content="친구가 습관부자에서 습관 메이트로 초대했어요. 같이 체크하면서 이번 주 체크 수를 나란히 볼 수 있어요.">
<meta name="robots" content="noindex">
<link rel="stylesheet" href="../style.css">
<style>
  .inv { max-width: 420px; margin: 0 auto; padding: 48px 16px 40px; text-align: center; }
  .inv h1 { font-size: 22px; margin: 0 0 10px; }
  .inv p { margin: 6px 0; line-height: 1.6; }
  .row { display: flex; flex-direction: column; gap: 10px; margin-top: 28px; }
  .row a { display: block; padding: 15px; border-radius: 14px; font-size: 16px; font-weight: 700; text-decoration: none; }
  .pri { background: #2E7D4F; color: #fff; }
  .have { display: inline-block; margin-top: 18px; font-size: 15px; color: #2E7D4F; text-decoration: underline; padding: 8px; }
  .fine { margin-top: 40px !important; font-size: 12px; color: #8a8a8a; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main class="inv">
  <h1>습관 메이트로 초대받았어요</h1>
  <p>같이 체크하면서 거지 탈출해요.<br><span id="sub">앱을 열면 바로 연결할지 물어봐요.</span></p>
  <div class="row">
    <a class="pri" id="ios" href="#" rel="noopener" hidden>App Store에서 받기</a>
    <a class="pri" id="aos" href="#" rel="noopener" hidden>Google Play에서 받기</a>
  </div>
  <a class="have" id="open" href="#">이미 앱이 있어요 → 앱에서 열기</a>
  <p class="fine" id="fine" hidden>연결이 안 되면 [랭킹 → 코드로 추가]에 <span id="code"></span></p>
</main>
<script>
(function () {
  'use strict';
  var EVENTS = { url: 'https://kmomnrmdfhhgkfiqskrp.supabase.co', key: 'sb_publishable_jQszQoPn-KTL14d3KvuqcQ_INczf2jG' };
  var ok = /^[23456789ABCDEFGHJKMNPQRSTUVWXYZ]{6}$/; // 0·O·1·I·L 없음(앱·서버와 같게)
  var c = (new URLSearchParams(location.search).get('c') || '').toUpperCase().replace(/[^0-9A-Z]/g, '').slice(0, 6);
  if (!ok.test(c)) c = '';
  var $ = function (id) { return document.getElementById(id); };
  var ua = navigator.userAgent;
  var isAndroid = /Android/i.test(ua);
  var isIOS = /iPhone|iPad|iPod/i.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
  $('open').href = 'habitrich://invite' + (c ? '?code=' + c : '');
  $('ios').href = 'https://apps.apple.com/app/apple-store/id6820009070?pt=129197102&mt=8&ct=invite';
  $('aos').href = 'https://play.google.com/store/apps/details?id=com.habitrich.app&referrer=' + encodeURIComponent('utm_source=invite&utm_medium=web' + (c ? '&utm_content=' + c : ''));
  // 기기별 메인 버튼: 안드로이드 = Play · iOS = App Store · PC = 둘 다
  if (!isIOS) $('aos').hidden = false;
  if (!isAndroid) $('ios').hidden = false;
  if (c) { $('code').textContent = c; $('fine').hidden = false; }
  // #218-7 안드로이드: intent 링크 — 앱이 있으면 앱이 열려 메이트 확인, 없으면 Play(초대 코드를 설치 경로에 실음)
  var intent = isAndroid ? 'intent://invite' + (c ? '?code=' + c : '') + '#Intent;scheme=habitrich;package=com.habitrich.app;S.browser_fallback_url=' + encodeURIComponent($('aos').href) + ';end' : null;
  if (intent) $('open').href = intent;
  // #218-3 iOS 는 설치 경로로 코드를 못 실음 — 설치 뒤 이 페이지로 돌아와 [앱에서 열기]
  if (isIOS) $('sub').textContent = '설치한 뒤 이 페이지로 돌아와서 [앱에서 열기]를 눌러 주세요.';
  var quiet = location.protocol === 'file:' || /^(localhost|127\.0\.0\.1)$/.test(location.hostname);
  var wid; try { wid = localStorage.getItem('ft_wid'); if (!wid) { wid = Math.random().toString(36).slice(2) + Date.now().toString(36); localStorage.setItem('ft_wid', wid); } } catch (e) { wid = 'anon' + Date.now().toString(36); }
  // 계측: 숫자·정해진 값만(코드는 보내지 않음) — page 'invite', to 1 앱 열기 · 2 iOS · 3 안드로이드
  function track(ev, to) {
    if (quiet) return;
    try { fetch(EVENTS.url + '/rest/v1/web_events', { method: 'POST', keepalive: true, headers: { apikey: EVENTS.key, Authorization: 'Bearer ' + EVENTS.key, 'Content-Type': 'application/json', Prefer: 'return=minimal' }, body: JSON.stringify({ wid: wid, ev: ev, props: to ? { page: 'invite', to: to } : { page: 'invite', has_code: c ? 1 : 0 } }) }).catch(function () {}); } catch (e) {}
  }
  track('view');
  // 안드로이드는 바로 Play 로(초대 코드를 설치 경로에 실어 설치 뒤 자동 연결). 한 탭에 한 번만
  // 안드로이드는 열리면 한 번 intent 로 이동(앱 있으면 앱, 없으면 Play). 한 탭에 한 번만 — 뒤로 오면 버튼으로
  if (intent && c) { try { if (!sessionStorage.getItem('inv_go')) { sessionStorage.setItem('inv_go', '1'); track('app_click', 1); setTimeout(function () { location.href = intent; }, 300); } } catch (e) {} }
  $('open').addEventListener('click', function () { track('app_click', 1); });
  $('ios').addEventListener('click', function () { track('app_click', 2); });
  $('aos').addEventListener('click', function () { track('app_click', 3); });
})();
</script>
</body>
</html>
